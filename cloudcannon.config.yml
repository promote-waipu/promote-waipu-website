collections_config:
  events:
    path: src/content/events
    name: Events
    icon: calendar
    url: /events/[slug]
    disable_url: false
    description: Add, edit or archive community events
    sort:
      key: date
      order: desc
    _enabled_editors:
      - content
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: .cloudcannon/schemas/event.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: true
  directory:
    path: src/content/directory
    name: Business Directory
    icon: office-building
    url: /directory/[slug]
    disable_url: false
    description: Manage business and community group listings
    sort:
      key: name
      order: asc
    _enabled_editors:
      - content
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: .cloudcannon/schemas/listing.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: true
  explore:
    path: src/content/explore
    name: Explore Waipu
    icon: map
    url: /explore/[slug]
    disable_url: false
    description: Local attractions and places to visit
    _enabled_editors:
      - content
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: .cloudcannon/schemas/explore.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: true
  data:
    path: src/data
    icon: data_usage
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_inputs:
  title:
    type: text
    label: Page Title
    cascade: true
  description:
    type: textarea
    label: Short Description (used for SEO and cards)
    cascade: true
  body:
    type: markdown
    options:
      allow_resize: true
      allow_custom_markup: false
      remove_custom_markup: false
      initial_height: 320
      bold: true
      bulletedlist: true
      image: true
      image_size_attributes: true
      italic: true
      link: true
      numberedlist: true
      redo: true
      table: true
      undo: true
    label: Page Content
    cascade: true
  date:
    type: date
    label: Event Date
    cascade: true
  end_date:
    type: date
    label: Event End Date (optional)
    cascade: true
  image:
    type: image
    options:
      width: 1200
      height: 630
    label: Main Image
    cascade: true
  category:
    type: select
    options:
      allow_empty: true
      values:
        - Accommodation
        - Automotive
        - Bakery & Cafe
        - Bars & Pubs
        - Beauty
        - Building & Construction
        - Clothing & Fashion
        - Coaching
        - Community Groups
        - Education
        - Engineering
        - Excavator Hire
        - Florist
        - Gift Shop
        - Glazier
        - Golf Club
        - Grocers & Supermarkets
        - Hairdresser
        - Hardware
        - Health & Wellbeing
        - Jewellers
        - Landscapers & Nursery
        - Lawyers
        - Liquor Store
        - Local Food Producer
        - Manufacturers
        - Massage
        - Museum
        - Pharmacy
        - Professional Services
        - Radio
        - Real Estate Agents
        - Rest Home
        - Restaurants
        - Second Hand Shops
        - Sports & Recreation
        - Trades
        - Venues
        - Vet
        - Yoga
    label: Directory Category
    cascade: true
  featured:
    type: checkbox
    label: Featured listing (appears highlighted)
    cascade: true
  published:
    type: checkbox
    label: Published (uncheck to hide without deleting)
    cascade: true
  seo_title:
    type: text
    label: SEO Page Title
    cascade: true
  seo_description:
    type: textarea
    label: SEO Description (shown in Google search results)
    cascade: true
  hero_heading:
    type: text
    label: Hero Heading
    cascade: true
  hero_tagline:
    type: textarea
    label: Hero Tagline (the line under the heading)
    cascade: true
  discover_heading:
    type: text
    label: Section Heading
    cascade: true
  discover_lead:
    type: textarea
    label: Lead Paragraph (larger text)
    cascade: true
  discover_body:
    type: textarea
    label: Body Paragraph
    cascade: true
  cta_heading:
    type: text
    label: Call-to-Action Heading
    cascade: true
  cta_body:
    type: textarea
    label: Call-to-Action Body Text
    cascade: true
  page_heading:
    type: text
    label: Page Heading
    cascade: true
  page_subheading:
    type: text
    label: Page Subheading
    cascade: true
  who_heading:
    type: text
    label: Section Heading
    cascade: true
  who_lead:
    type: textarea
    label: Lead Paragraph (larger text)
    cascade: true
  who_body:
    type: textarea
    label: Body Text (press Enter twice between paragraphs)
    cascade: true
  contact_email:
    type: email
    label: Secretary Email Address
    cascade: true
  community_heading:
    type: text
    label: Section Heading
    cascade: true
  community_lead:
    type: textarea
    label: Lead Paragraph (larger text)
    cascade: true
  community_body:
    type: textarea
    label: Body Text (press Enter twice between paragraphs)
    cascade: true
data_config:
  navigation:
    path: src/data/navigation.yml
    name: Navigation Menu
  site_settings:
    path: src/data/site-settings.yml
    name: Site Settings
  homepage:
    path: src/data/homepage.json
    name: Homepage Content
  about:
    path: src/data/about.json
    name: About Page Content
editor:
  default_path: /
timezone: Etc/UTC
collections_config_override: true
uploads:
  paths:
    uploads: public/images/uploads
  dam_uploads: public/images/uploads
  image_size_attributes: true
